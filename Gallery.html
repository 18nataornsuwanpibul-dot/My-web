<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>gallery</title>
    <style>
        .gallery {
            display: flex;
            width: 400px;
            height: 600px;
            gap: 10px;
            margin: 0 auto;
        }
        .panel {
            flex: 1;
            background-size: cover;/*.ให้รูปขยายเต็มกล่อง*/
            background-position: center;/*จัดตำแห่งตรงกลาง*/
            border-radius: 20px;cursor: pointer;/*ทำมุมของกล่อง มน*/
            cursor: pointer;/*ทำรูป cursor เป็นรูปมือ*/
            background-color: cadetblue;
            filter: grayscale(80%);
            transition: flex 0.6s cubic-bezier(0.075, 0.82, 0.165, 1);
        }
        .p1{
           background-image: url(Screenshot\ 2026-08-13\ 132449.png); 
        }
        .p2{
            background-image: url(Screenshot\ 2026-08-13\ 132604.png);
        }
        .p3{
            background-image: url(Screenshot\ 2026-08-13\ 132710.png);
        }
        .panel:hover{
            flex: 4;
            filter: grayscale(0%);
        }
        h1 {
        background-color: rgb(248, 186, 186);
            background-size: cover;
            text-align: center;/*จัดให้อยู่ตรงกลาง*/
            width: 100%;/*กว้าง*/
            height: 125px;/*สูง*/
            border-radius: 10px; /* ใส่ขอบมน */
            margin: auto;
            background-image: url(p2.jpg);
            color: rgb(166, 237, 255);
        }
        p{
            text-align: center;
            font-size: 25px;
            color: rgb(174, 179, 255);
            background-image: url(p2.jpg);
            width: 100%;
            height: 150px;
            border-radius: 10px;/*ใส่ขอบมน*/
        }
    </style>
</head>
<body>
    <h1></h1>
    <div class="gallery">
        <a href="Screenshot 2026-08-13 132449.png" class="panel p1"></a>
        <a href="Screenshot 2026-08-13 132604.png" class="panel p2"> </a>
        <a href="Screenshot 2026-08-13 132710.png" class="panel p3"></a>
    </div>
    <hr>
    <p>พัฒนาโดย เด็กหญิง ณฐอร สุวรรณพิบูลย์ เลขที่19 ป.6/5</p>
    
  
</body> 
</div>
</html>
